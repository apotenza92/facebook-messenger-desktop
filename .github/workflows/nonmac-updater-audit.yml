name: Native Windows and AppImage updater audit

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      channel:
        description: Stable or beta application identity
        required: true
        type: string
      target:
        description: Native target
        required: true
        type: string
      previous_version:
        description: Published N-1 release version
        required: true
        type: string
      candidate_build_artifact:
        description: Current-run build artifact to reuse; omit for standalone CI
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      channel:
        description: Stable or beta application identity
        required: true
        type: choice
        default: beta
        options:
          - stable
          - beta
      target:
        description: Native target
        required: true
        type: choice
        default: win32-x64
        options:
          - win32-arm64
          - win32-x64
          - linux-arm64
          - linux-x64
      previous_version:
        description: Published N-1 release version
        required: true
        type: string
        default: 1.4.0

concurrency:
  group: messenger-nonmac-updater-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  updater:
    name: Native updater (${{ inputs.target }})
    runs-on: ${{ inputs.target == 'win32-arm64' && 'windows-11-arm' || inputs.target == 'win32-x64' && 'windows-2025' || inputs.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      MESSENGER_AUDIT_PLATFORM: ${{ startsWith(inputs.target, 'win32-') && 'win32' || 'linux' }}
      MESSENGER_AUDIT_CHANNEL: ${{ inputs.channel }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Require the matching native runner
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          if [[ "$MESSENGER_AUDIT_PLATFORM" == win32 ]]; then
            test "$(node -p 'process.platform')" = win32
          else
            test "$(node -p 'process.platform')" = linux
          fi
          [[ "$MESSENGER_AUDIT_CHANNEL" == stable ||
            "$MESSENGER_AUDIT_CHANNEL" == beta ]]

      - name: Install Linux launch dependencies
        if: startsWith(inputs.target, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            xvfb \
            xauth \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon0 \
            libxrandr2 \
            libxss1
          sudo apt-get install -y libasound2 ||
            sudo apt-get install -y libasound2t64
          sudo apt-get install -y libfuse2 ||
            sudo apt-get install -y libfuse2t64

      - name: Install dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Create disposable loopback-only TUF trust
        shell: bash
        run: |
          set -euo pipefail
          TRUST_DIR='${{ runner.temp }}/messenger-updater-trust'
          mkdir -p "$TRUST_DIR"
          mv build/update-trust/root.json "$TRUST_DIR/production-root.json"
          node scripts/create-tuf-production-trust.cjs \
            --root build/update-trust/root.json \
            --private-key-bundle "$TRUST_DIR/private.json"

      - name: Download candidate build artifact
        if: inputs.candidate_build_artifact != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.candidate_build_artifact }}
          path: ci-updater/build

      - name: Prepare reused candidate package
        if: inputs.candidate_build_artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          PRODUCT_PREFIX=Messenger
          PACKAGE_PREFIX=facebook-messenger-desktop
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            PRODUCT_PREFIX=Messenger-Beta
            PACKAGE_PREFIX=facebook-messenger-desktop-beta
          fi
          mkdir -p ci-updater/candidate
          if [[ "$MESSENGER_AUDIT_PLATFORM" == win32 ]]; then
            CANDIDATE="$PRODUCT_PREFIX-windows-$ARCH-setup.exe"
            cp "ci-updater/build/$CANDIDATE" ci-updater/candidate/
            cp ci-updater/build/updater-app.asar ci-updater/candidate/app.asar
          else
            LINUX_ARCH="$([[ "$ARCH" == x64 ]] && echo x86_64 || echo arm64)"
            CANDIDATE="$PACKAGE_PREFIX-$LINUX_ARCH.AppImage"
            cp "ci-updater/build/$CANDIDATE" ci-updater/candidate/
          fi

      - name: Build candidate package for standalone CI
        if: inputs.candidate_build_artifact == ''
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          FORCE_BETA_BUILD: ${{ inputs.channel == 'beta' && 'true' || '' }}
        run: |
          set -euo pipefail
          ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          PRODUCT_PREFIX=Messenger
          PACKAGE_PREFIX=facebook-messenger-desktop
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            PRODUCT_PREFIX=Messenger-Beta
            PACKAGE_PREFIX=facebook-messenger-desktop-beta
          fi
          mkdir -p ci-updater/candidate
          if [[ "$MESSENGER_AUDIT_PLATFORM" == win32 ]]; then
            npx --no-install electron-builder \
              --config electron-builder.config.js \
              --win nsis "--$ARCH" --publish=never
            CANDIDATE="$PRODUCT_PREFIX-windows-$ARCH-setup.exe"
            cp "release/$CANDIDATE" ci-updater/candidate/
            UNPACKED=win-unpacked
            if [[ "$ARCH" == arm64 ]]; then UNPACKED=win-arm64-unpacked; fi
            cp "release/$UNPACKED/resources/app.asar" \
              ci-updater/candidate/app.asar
          else
            npx --no-install electron-builder \
              --config electron-builder.config.js \
              --linux AppImage "--$ARCH" --publish=never
            LINUX_ARCH="$(
              [[ "$ARCH" == x64 ]] && echo x86_64 || echo arm64
            )"
            CANDIDATE="$PACKAGE_PREFIX-$LINUX_ARCH.AppImage"
            cp "release/$CANDIDATE" ci-updater/candidate/
          fi

      - name: Create candidate update metadata
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_VERSION="$(node -p 'require("./package.json").version')"
          ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          PRODUCT_PREFIX=Messenger
          PACKAGE_PREFIX=facebook-messenger-desktop
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            PRODUCT_PREFIX=Messenger-Beta
            PACKAGE_PREFIX=facebook-messenger-desktop-beta
          fi
          if [[ "$MESSENGER_AUDIT_PLATFORM" == win32 ]]; then
            CANDIDATE="$PRODUCT_PREFIX-windows-$ARCH-setup.exe"
          else
            LINUX_ARCH="$([[ "$ARCH" == x64 ]] && echo x86_64 || echo arm64)"
            CANDIDATE="$PACKAGE_PREFIX-$LINUX_ARCH.AppImage"
          fi
          node scripts/create-update-metadata.mjs \
            --artifact "ci-updater/candidate/$CANDIDATE" \
            --output ci-updater/candidate/update.yml \
            --version "$CANDIDATE_VERSION"

      - name: Download checksum-sealed published predecessor
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_VERSION="$(node -p 'require("./package.json").version')"
          PREVIOUS_VERSION='${{ inputs.previous_version }}'
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            [[ "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]
          else
            [[ "$PREVIOUS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          test "$PREVIOUS_VERSION" != "$CANDIDATE_VERSION"
          ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          PRODUCT_PREFIX=Messenger
          PACKAGE_PREFIX=facebook-messenger-desktop
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            PRODUCT_PREFIX=Messenger-Beta
            PACKAGE_PREFIX=facebook-messenger-desktop-beta
          fi
          mkdir -p ci-updater/previous
          if [[ "$MESSENGER_AUDIT_PLATFORM" == win32 ]]; then
            NAME="$PRODUCT_PREFIX-windows-$ARCH-setup.exe"
          else
            LINUX_ARCH="$([[ "$ARCH" == x64 ]] && echo x86_64 || echo arm64)"
            NAME="$PACKAGE_PREFIX-$LINUX_ARCH.AppImage"
          fi
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$PREVIOUS_VERSION"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            "$BASE_URL/SHA256SUMS" --output ci-updater/previous/SHA256SUMS
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            "$BASE_URL/$NAME" --output "ci-updater/previous/$NAME"
          EXPECTED_SHA256="$(awk -v name="$NAME" '$2 == name { print $1; exit }' ci-updater/previous/SHA256SUMS)"
          test -n "$EXPECTED_SHA256"
          ACTUAL_SHA256="$(
            node -e \
              'const {createHash}=require("node:crypto");const fs=require("node:fs");process.stdout.write(createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' \
              "ci-updater/previous/$NAME"
          )"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Inspect AppImage architecture and native dependency closure
        if: startsWith(inputs.target, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          PACKAGE_PREFIX=facebook-messenger-desktop
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            PACKAGE_PREFIX=facebook-messenger-desktop-beta
          fi
          LINUX_ARCH="$(
            [[ "$ARCH" == x64 ]] && echo x86_64 || echo arm64
          )"
          npm run test:linux-artifacts -- \
            "ci-updater/candidate/$PACKAGE_PREFIX-$LINUX_ARCH.AppImage"

      - name: Exercise corrupt, wrong-signature, and valid replacement
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ endsWith(inputs.target, '-arm64') && 'arm64' || 'x64' }}'
          PRODUCT_PREFIX=Messenger
          PACKAGE_PREFIX=facebook-messenger-desktop
          if [[ "$MESSENGER_AUDIT_CHANNEL" == beta ]]; then
            PRODUCT_PREFIX=Messenger-Beta
            PACKAGE_PREFIX=facebook-messenger-desktop-beta
          fi
          EVIDENCE='${{ runner.temp }}/messenger-updater-evidence'
          ROOT=build/update-trust/root.json
          PRIVATE='${{ runner.temp }}/messenger-updater-trust/private.json'
          if [[ "$MESSENGER_AUDIT_PLATFORM" == win32 ]]; then
            CANDIDATE="$PRODUCT_PREFIX-windows-$ARCH-setup.exe"
            node scripts/test-nonmac-update.cjs \
              --arch "$ARCH" \
              --previous-artifact \
              "ci-updater/previous/$PRODUCT_PREFIX-windows-$ARCH-setup.exe" \
              --candidate-artifact "ci-updater/candidate/$CANDIDATE" \
              --candidate-app-asar ci-updater/candidate/app.asar \
              --candidate-directory ci-updater/candidate \
              --candidate-metadata ci-updater/candidate/update.yml \
              --channel "$MESSENGER_AUDIT_CHANNEL" \
              --target-name latest.yml \
              --root "$ROOT" \
              --private-key-bundle "$PRIVATE" \
              --evidence "$EVIDENCE"
          else
            LINUX_ARCH="$(
              [[ "$ARCH" == x64 ]] && echo x86_64 || echo arm64
            )"
            CANDIDATE="$PACKAGE_PREFIX-$LINUX_ARCH.AppImage"
            TARGET=latest-linux.yml
            if [[ "$ARCH" == arm64 ]]; then
              TARGET=latest-linux-arm64.yml
            fi
            xvfb-run -a node scripts/test-nonmac-update.cjs \
              --arch "$ARCH" \
              --previous-artifact \
              "ci-updater/previous/$PACKAGE_PREFIX-$LINUX_ARCH.AppImage" \
              --candidate-artifact "ci-updater/candidate/$CANDIDATE" \
              --candidate-directory ci-updater/candidate \
              --candidate-metadata ci-updater/candidate/update.yml \
              --channel "$MESSENGER_AUDIT_CHANNEL" \
              --target-name "$TARGET" \
              --root "$ROOT" \
              --private-key-bundle "$PRIVATE" \
              --evidence "$EVIDENCE"
          fi

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: messenger-${{ inputs.target }}-updater-evidence
          path: ${{ runner.temp }}/messenger-updater-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable trust and packages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf '${{ runner.temp }}/messenger-updater-trust'
          rm -rf ci-updater release
