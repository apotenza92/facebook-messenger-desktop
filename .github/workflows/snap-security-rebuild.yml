name: Snap Security Rebuild

# Rebuilds published release tags so the Snap Store copies pick up Ubuntu
# security updates. The scheduled run only rebuilds a line when the store is
# missing its version or a primed Ubuntu package is outdated, and never
# replaces a higher version (see scripts/snap-rebuild-plan.sh). Prereleases go
# to edge and then beta. Stable versions go to candidate, and also to beta and
# edge when no higher beta exists. Stable only receives a rebuild of the exact
# version it already carries; a new version still requires an explicitly
# approved promotion.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SNAPCRAFT_BUILD_INFO: "1"
  SNAP_NAME: facebook-messenger-desktop

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      lineage:
        description: "Release line to check"
        required: false
        default: all
        type: choice
        options:
          - all
          - prerelease
          - stable
      force:
        description: "Rebuild even when the published snap is current"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Plan and build, but upload and release nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: snap-security-rebuild
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan security rebuilds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      builds: ${{ steps.plan.outputs.builds }}
      stable_refresh: ${{ steps.plan.outputs.stable_refresh }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install inspection tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Compare published snaps with the Ubuntu archive
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAGE: ${{ inputs.lineage || 'all' }}
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail
          status=0
          scripts/snap-rebuild-plan.sh 2>plan.log || status=$?
          cat plan.log >&2
          {
            echo "## Snap security rebuild plan"
            echo
            echo '```'
            cat plan.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Runs every time, even with nothing to rebuild, so an expired or revoked
  # store credential is noticed before a security rebuild depends on it.
  check_credentials:
    name: Check Snap Store credential
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: snap-security-rebuild
    timeout-minutes: 15

    steps:
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Check credential access and expiry
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          whoami=""
          for attempt in 1 2 3; do
            if whoami="$(snapcraft whoami 2>&1)"; then
              break
            fi
            whoami=""
            sleep $((attempt * 20))
          done
          test -n "$whoami"
          grep -Eq '^permissions:.*package_push.*package_release' <<<"$whoami"
          expires="$(sed -n 's/^expires: //p' <<<"$whoami")"
          test -n "$expires"
          echo "Snap Store credential expires $expires."
          if [ "$(date -d "$expires" +%s)" -lt "$(date -d '+30 days' +%s)" ]; then
            echo "::warning::The Snap Store credential expires $expires. Regenerate it with snapcraft export-login and update the snap-* environment secrets."
          fi

  build:
    name: Build ${{ matrix.tag }} ${{ matrix.arch }} snap
    needs:
      - plan
      - check_credentials
    if: needs.plan.outputs.builds != '[]' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    environment: snap-security-rebuild
    timeout-minutes: 90

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ matrix.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner, tag, and version
        env:
          TAG: ${{ matrix.tag }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"

      - name: Install build tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          sudo snap install snapcraft --classic

      # Since GUI asset mediation (snapcraft 9.1+), `desktop: meta/gui/<app>.desktop`
      # is resolved from snap/meta/gui/ instead of the snap/gui/ copy, so release
      # tags using the documented layout fail to build (canonical/snapcraft#6519).
      # Mirror the desktop files there (untracked; the tag's content is
      # unchanged). The packed file is compared with snap/gui/ below. Remove
      # this once the issue is fixed in the snapcraft stable channel.
      - name: Work around snapcraft desktop file lookup (canonical/snapcraft#6519)
        run: |
          set -euo pipefail
          mkdir -p snap/meta/gui
          cp snap/gui/*.desktop snap/meta/gui/

      - name: Build snap with package manifest
        run: |
          set -euo pipefail
          sudo --preserve-env=FORCE_JAVASCRIPT_ACTIONS_TO_NODE24,SNAPCRAFT_BUILD_INFO \
            snapcraft --destructive-mode --build-for "${{ matrix.arch }}"

      - name: Inspect snap and security manifest
        id: snap
        run: |
          set -euo pipefail
          snap_file="$(find . -maxdepth 1 -name "facebook-messenger-desktop_*_${{ matrix.arch }}.snap" -print -quit)"
          test -n "$snap_file"

          unsquashfs -cat "$snap_file" meta/snap.yaml > /tmp/snap-meta.yaml
          grep -Fx "name: facebook-messenger-desktop" /tmp/snap-meta.yaml
          grep -Ex "version: '?${{ matrix.version }}'?" /tmp/snap-meta.yaml

          unsquashfs -cat "$snap_file" snap/manifest.yaml > /tmp/snap-manifest.yaml
          grep -F "libasound2-data" /tmp/snap-manifest.yaml
          grep -F "libasound2t64" /tmp/snap-manifest.yaml

          unsquashfs -cat "$snap_file" meta/gui/facebook-messenger-desktop.desktop > /tmp/snap.desktop
          diff -u snap/gui/facebook-messenger-desktop.desktop /tmp/snap.desktop
          unsquashfs -cat "$snap_file" meta/gui/icon.png | cmp - snap/gui/icon.png

          echo "snap_file=$snap_file" >>"$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: facebook-messenger-desktop-${{ matrix.version }}-${{ matrix.arch }}-security-rebuild
          path: ${{ steps.snap.outputs.snap_file }}
          if-no-files-found: error

      - name: Upload snap to refresh channel
        if: inputs.dry_run != true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          UPLOAD_CHANNEL: ${{ matrix.upload_channel }}
        run: |
          set -euo pipefail
          case "$UPLOAD_CHANNEL" in edge | candidate) ;; *) exit 1 ;; esac
          snapcraft upload "${{ steps.snap.outputs.snap_file }}" --release "$UPLOAD_CHANNEL"

  verify_and_release:
    name: Verify ${{ matrix.tag }} in ${{ matrix.upload_channel }} and release
    needs:
      - plan
      - build
    # Release each line whose builds finished, even if the other line's failed;
    # a line with a missing upload times out below without releasing anything.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result != 'skipped' && inputs.dry_run != true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-latest
    environment: snap-beta-promotion
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Wait for both refreshed revisions
        id: refreshed
        run: |
          scripts/wait-snap-refreshed-revisions.sh "$SNAP_NAME" "${{ matrix.upload_channel }}" \
            "${{ matrix.version }}" "${{ matrix.amd64_floor }}" "${{ matrix.arm64_floor }}"

      - name: Install Snapcraft
        if: join(matrix.release_to, ' ') != ''
        run: sudo snap install snapcraft --classic

      - name: Release exact refreshed revisions
        if: join(matrix.release_to, ' ') != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          RELEASE_TO: ${{ join(matrix.release_to, ' ') }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          set -euo pipefail
          for channel in $RELEASE_TO; do
            case "$channel" in edge | beta) ;; *) exit 1 ;; esac
            { yes || true; } | snapcraft release "$SNAP_NAME" "$AMD64_REVISION" "$channel"
            { yes || true; } | snapcraft release "$SNAP_NAME" "$ARM64_REVISION" "$channel"
          done

      - name: Verify exact published revisions
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
          CHANNELS: ${{ matrix.upload_channel }} ${{ join(matrix.release_to, ' ') }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          set -euo pipefail
          for channel in $CHANNELS; do
            for _ in 1 2 3 4 5; do
              if scripts/verify-snap-channel-revisions.sh \
                "$SNAP_NAME" "$channel" "$EXPECTED_VERSION" "$AMD64_REVISION" "$ARM64_REVISION"; then
                continue 2
              fi
              sleep 20
            done
            exit 1
          done

      - name: Note stable release gate
        if: matrix.lineage == 'stable' && !matrix.refresh_stable
        env:
          VERSION: ${{ matrix.version }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          {
            echo "Refreshed $VERSION is in candidate (amd64 r$AMD64_REVISION, arm64 r$ARM64_REVISION)."
            echo "Stable does not carry $VERSION yet, so it is unchanged until an explicitly approved promotion."
          } >>"$GITHUB_STEP_SUMMARY"

  # Stable only takes a rebuild of the version it already carries (the planner
  # sets stable_refresh only then), so no new version reaches stable here.
  refresh_stable:
    name: Refresh stable with the rebuilt candidate
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.stable_refresh != '' && needs.build.result != 'skipped' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: snap-stable-promotion
    # Shared with snap-promote.yml so a manual stable promotion and this
    # refresh never interleave.
    concurrency:
      group: snap-stable-channel
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      VERSION: ${{ fromJSON(needs.plan.outputs.stable_refresh || '{}').version }}
      AMD64_FLOOR: ${{ fromJSON(needs.plan.outputs.stable_refresh || '{}').amd64_floor }}
      ARM64_FLOOR: ${{ fromJSON(needs.plan.outputs.stable_refresh || '{}').arm64_floor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Wait for both rebuilt candidate revisions
        id: refreshed
        run: |
          scripts/wait-snap-refreshed-revisions.sh "$SNAP_NAME" candidate "$VERSION" "$AMD64_FLOOR" "$ARM64_FLOOR"

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      # Checked immediately before each release so a version promoted in the
      # meantime is never replaced by this rebuild.
      - name: Release rebuilt revisions while stable still carries this version
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          set -euo pipefail
          stable_carries_version() {
            local info arch
            info="$(curl -fsSL -H "Snap-Device-Series: 16" -H "User-Agent: snapd/2.63" \
              "https://api.snapcraft.io/v2/snaps/info/${SNAP_NAME}")"
            for arch in amd64 arm64; do
              jq -e --arg arch "$arch" --arg version "$VERSION" \
                '[."channel-map"[] | select(.channel.track == "latest" and .channel.risk == "stable" and .channel.architecture == $arch)] | first | .version == $version' \
                <<<"$info" >/dev/null || return 1
            done
          }
          stable_carries_version
          { yes || true; } | snapcraft release "$SNAP_NAME" "$AMD64_REVISION" stable
          stable_carries_version
          { yes || true; } | snapcraft release "$SNAP_NAME" "$ARM64_REVISION" stable

      - name: Verify exact stable revisions
        env:
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5; do
            if scripts/verify-snap-channel-revisions.sh \
              "$SNAP_NAME" stable "$VERSION" "$AMD64_REVISION" "$ARM64_REVISION"; then
              echo "Stable $VERSION refreshed to amd64 r$AMD64_REVISION, arm64 r$ARM64_REVISION." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          exit 1
