name: Snap Security Rebuild

# Rebuilds published release tags so the Snap Store copies pick up Ubuntu
# security updates. The scheduled run only rebuilds a line when the store is
# missing its version or a primed Ubuntu package is outdated, and never
# replaces a higher version (see scripts/snap-rebuild-plan.sh). Prereleases go
# to edge and then beta. Stable versions go to candidate, and also to beta and
# edge when no higher beta exists. Stable is never changed here and still
# requires an explicitly approved promotion.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SNAPCRAFT_BUILD_INFO: "1"
  SNAP_NAME: facebook-messenger-desktop

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      lineage:
        description: "Release line to check"
        required: false
        default: all
        type: choice
        options:
          - all
          - prerelease
          - stable
      force:
        description: "Rebuild even when the published snap is current"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Only report what would be rebuilt"
        required: false
        default: false
        type: boolean

concurrency:
  group: snap-security-rebuild
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan security rebuilds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      builds: ${{ steps.plan.outputs.builds }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install inspection tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Compare published snaps with the Ubuntu archive
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAGE: ${{ inputs.lineage || 'all' }}
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail
          status=0
          scripts/snap-rebuild-plan.sh 2>plan.log || status=$?
          cat plan.log >&2
          {
            echo "## Snap security rebuild plan"
            echo
            echo '```'
            cat plan.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  build:
    name: Build ${{ matrix.tag }} ${{ matrix.arch }} snap
    needs: plan
    if: needs.plan.outputs.builds != '[]' && github.ref == 'refs/heads/main' && inputs.dry_run != true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    environment: snap-security-rebuild
    timeout-minutes: 90

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ matrix.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner, tag, and version
        env:
          TAG: ${{ matrix.tag }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"

      - name: Install build tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          sudo snap install snapcraft --classic

      - name: Build snap with package manifest
        run: |
          set -euo pipefail
          sudo --preserve-env=FORCE_JAVASCRIPT_ACTIONS_TO_NODE24,SNAPCRAFT_BUILD_INFO \
            snapcraft --destructive-mode --build-for "${{ matrix.arch }}"

      - name: Inspect snap and security manifest
        id: snap
        run: |
          set -euo pipefail
          snap_file="$(find . -maxdepth 1 -name "facebook-messenger-desktop_*_${{ matrix.arch }}.snap" -print -quit)"
          test -n "$snap_file"

          unsquashfs -cat "$snap_file" meta/snap.yaml > /tmp/snap-meta.yaml
          grep -Fx "name: facebook-messenger-desktop" /tmp/snap-meta.yaml
          grep -Ex "version: '?${{ matrix.version }}'?" /tmp/snap-meta.yaml

          unsquashfs -cat "$snap_file" snap/manifest.yaml > /tmp/snap-manifest.yaml
          grep -F "libasound2-data" /tmp/snap-manifest.yaml
          grep -F "libasound2t64" /tmp/snap-manifest.yaml

          echo "snap_file=$snap_file" >>"$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: facebook-messenger-desktop-${{ matrix.version }}-${{ matrix.arch }}-security-rebuild
          path: ${{ steps.snap.outputs.snap_file }}
          if-no-files-found: error

      - name: Upload snap to refresh channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          UPLOAD_CHANNEL: ${{ matrix.upload_channel }}
        run: |
          set -euo pipefail
          case "$UPLOAD_CHANNEL" in edge | candidate) ;; *) exit 1 ;; esac
          snapcraft upload "${{ steps.snap.outputs.snap_file }}" --release "$UPLOAD_CHANNEL"

  verify_and_release:
    name: Verify ${{ matrix.tag }} in ${{ matrix.upload_channel }} and release
    needs:
      - plan
      - build
    # Release each line whose builds finished, even if the other line's failed;
    # a line with a missing upload times out below without releasing anything.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-latest
    environment: snap-beta-promotion
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Wait for both refreshed revisions
        id: refreshed
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
          UPLOAD_CHANNEL: ${{ matrix.upload_channel }}
          AMD64_FLOOR: ${{ matrix.amd64_floor }}
          ARM64_FLOOR: ${{ matrix.arm64_floor }}
        run: |
          set -euo pipefail

          snap_info_url="https://api.snapcraft.io/v2/snaps/info/${SNAP_NAME}"
          for attempt in $(seq 1 60); do
            info="$(curl -fsSL \
              -H "Snap-Device-Series: 16" \
              -H "User-Agent: snapd/2.63" \
              "$snap_info_url" || true)"

            if [ -z "$info" ]; then
              info='{"channel-map":[]}'
            fi

            amd64_revision="$(jq -r --arg risk "$UPLOAD_CHANNEL" --arg version "$EXPECTED_VERSION" \
              '."channel-map"[] | select(.channel.track == "latest" and .channel.risk == $risk and .channel.architecture == "amd64" and .version == $version) | .revision' \
              <<<"$info")"
            arm64_revision="$(jq -r --arg risk "$UPLOAD_CHANNEL" --arg version "$EXPECTED_VERSION" \
              '."channel-map"[] | select(.channel.track == "latest" and .channel.risk == $risk and .channel.architecture == "arm64" and .version == $version) | .revision' \
              <<<"$info")"

            echo "Attempt $attempt/60: $UPLOAD_CHANNEL amd64=r${amd64_revision:-missing}, arm64=r${arm64_revision:-missing}"

            if [[ "$amd64_revision" =~ ^[0-9]+$ ]] &&
              [[ "$arm64_revision" =~ ^[0-9]+$ ]] &&
              [ "$amd64_revision" -gt "$AMD64_FLOOR" ] &&
              [ "$arm64_revision" -gt "$ARM64_FLOOR" ]; then
              {
                echo "amd64_revision=$amd64_revision"
                echo "arm64_revision=$arm64_revision"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for refreshed $UPLOAD_CHANNEL revisions on both architectures." >&2
          exit 1

      - name: Install Snapcraft
        if: join(matrix.release_to, ' ') != ''
        run: sudo snap install snapcraft --classic

      - name: Release exact refreshed revisions
        if: join(matrix.release_to, ' ') != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          RELEASE_TO: ${{ join(matrix.release_to, ' ') }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          set -euo pipefail
          for channel in $RELEASE_TO; do
            case "$channel" in edge | beta) ;; *) exit 1 ;; esac
            { yes || true; } | snapcraft release "$SNAP_NAME" "$AMD64_REVISION" "$channel"
            { yes || true; } | snapcraft release "$SNAP_NAME" "$ARM64_REVISION" "$channel"
          done

      - name: Verify exact published revisions
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
          CHANNELS: ${{ matrix.upload_channel }} ${{ join(matrix.release_to, ' ') }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          set -euo pipefail
          for channel in $CHANNELS; do
            for _ in 1 2 3 4 5; do
              if scripts/verify-snap-channel-revisions.sh \
                "$SNAP_NAME" "$channel" "$EXPECTED_VERSION" "$AMD64_REVISION" "$ARM64_REVISION"; then
                continue 2
              fi
              sleep 20
            done
            exit 1
          done

      - name: Note stable release gate
        if: matrix.lineage == 'stable'
        env:
          VERSION: ${{ matrix.version }}
          AMD64_REVISION: ${{ steps.refreshed.outputs.amd64_revision }}
          ARM64_REVISION: ${{ steps.refreshed.outputs.arm64_revision }}
        run: |
          {
            echo "Refreshed $VERSION is in candidate (amd64 r$AMD64_REVISION, arm64 r$ARM64_REVISION)."
            echo "Stable is unchanged until an explicitly approved promotion."
          } >>"$GITHUB_STEP_SUMMARY"
